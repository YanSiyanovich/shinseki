<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Family Member Quiz</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card" id="quiz-card">
    <h3 id="question-text">Loading...</h3>
    
    <div id="text-input-container" hidden>
      <input type="text" id="user-input" placeholder="Enter your answer...">
      <br>
      <button type="button" id="submit-button">Submit</button>
    </div>

    <div id="choice-container" class="choice-buttons" hidden>
      <button type="button" id="yes-button" class="yes">Yes</button>
      <button type="button" id="no-button" class="no">No</button>
    </div>
  </div>

<script src="shinseki.js"></script>

</body>
</html>
